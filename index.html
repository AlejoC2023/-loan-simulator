
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Simulator</title>
</head>
<body>

    <h1>Loan Simulator</h1>

    <h2>Loan Information</h2>

    <label for="amount">Loan Amount:</label>
    <input type="number" id="amount" min="0" step="0.01">

    <br><br>

    <label for="interest">Interest Rate (%):</label>
    <input type="number" id="interest" min="0" step="0.01">

    <br><br>

    <label for="rateType">Interest Rate Type:</label>
    <select id="rateType">
        <option value="monthly">Effective Monthly</option>
        <option value="annual">Effective Annual</option>
    </select>

    <br><br>

    <label for="months">Loan Term (Months):</label>
    <input type="number" id="months" min="1" step="1">

    <br><br>

    <button onclick="calculateLoan()">Calculate Loan</button>

    <h2>Loan Results</h2>

    <p id="monthlyPayment"></p>
    <p id="totalPayment"></p>
    <p id="totalInterest"></p>

    <h2>Amortization Schedule</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Month</th>
                <th>Payment</th>
                <th>Principal</th>
                <th>Interest</th>
                <th>Remaining Balance</th>
            </tr>
        </thead>
        <tbody id="schedule">
        </tbody>
    </table>

    <script>
        function calculateLoan() {

            const amount = parseFloat(
                document.getElementById("amount").value
            );

            const interest = parseFloat(
                document.getElementById("interest").value
            );

            const rateType =
                document.getElementById("rateType").value;

            const months = parseInt(
                document.getElementById("months").value
            );

            if (
                !Number.isFinite(amount) ||
                !Number.isFinite(interest) ||
                !Number.isInteger(months) ||
                amount <= 0 ||
                interest < 0 ||
                months <= 0
            ) {
                alert("Please enter valid loan information.");
                return;
            }

            let monthlyRate;

            if (rateType === "monthly") {
                monthlyRate = interest / 100;
            } else {
                monthlyRate = Math.pow(
                    1 + interest / 100,
                    1 / 12
                ) - 1;
            }

            let payment;

            if (monthlyRate === 0) {
                payment = amount / months;
            } else {
                payment =
                    amount *
                    monthlyRate /
                    (1 - Math.pow(1 + monthlyRate, -months));
            }

            let balance = amount;
            let totalInterest = 0;
            let scheduleHTML = "";

            for (let month = 1; month <= months; month++) {

                const interestPayment = balance * monthlyRate;

                let principalPayment = payment - interestPayment;

                let actualPayment = payment;

                if (month === months) {
                    principalPayment = balance;
                    actualPayment = principalPayment + interestPayment;
                }

                balance -= principalPayment;

                if (Math.abs(balance) < 0.000001) {
                    balance = 0;
                }

                totalInterest += interestPayment;

                scheduleHTML += `
                    <tr>
                        <td>${month}</td>
                        <td>${actualPayment.toFixed(2)}</td>
                        <td>${principalPayment.toFixed(2)}</td>
                        <td>${interestPayment.toFixed(2)}</td>
                        <td>${balance.toFixed(2)}</td>
                    </tr>
                `;
            }

            document.getElementById("monthlyPayment").textContent =
                "Monthly Payment: " + payment.toFixed(2);

            document.getElementById("totalPayment").textContent =
                "Total Payment: " +
                (amount + totalInterest).toFixed(2);

            document.getElementById("totalInterest").textContent =
                "Total Interest: " + totalInterest.toFixed(2);

            document.getElementById("schedule").innerHTML =
                scheduleHTML;
        }
    </script>

</body>
</html>
